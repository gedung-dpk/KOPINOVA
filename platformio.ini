[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  bogde/HX711@^0.7.5
build_flags =
  -D CORE_DEBUG_LEVEL=3

